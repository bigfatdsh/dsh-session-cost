# ============================================================================
# dsh-session-cost —— DSH bundle 补丁
# ============================================================================
# DSH 启动时按 bundle 层栈叠加各插件 patch，本文件把会话花费插件插进 profile
# 的配置树。Host 半边注册 `sessionCost` 会话投影；浏览器半边（package.json 的
# `exports["./client"]` + `dsh.client` 声明）负责把两个数字画到界面上。
#
# 本地开发安装：
#   dsh plugin --profile desktop add link:<本目录绝对路径>
# ============================================================================

- insert:
    - id: session-cost
      name: dsh-session-cost
      config:
        # 计价币种。只影响显示符号；内置价目表按人民币录入。
        currency: CNY
        # 官方峰谷分时计价：高峰时段单价翻倍。关掉则一律按空闲时段价。
        peakPricing: true
        # 其余可选配置（不写即用默认值）：
        #
        # prices:           自定义价目表，覆盖内置表；每项
        #                   { match, hit, miss, out }，match 是模型名子串，
        #                   价格为「元/百万 token」，可写单值或 [空闲, 高峰]。
        # defaultPrice:     内置表与 prices 都没命中时的兜底价。不配置则这类
        #                   模型的 token 只计入「未计价」，界面显示「¥x+」。
        # holidays:         按空闲时段计费的法定节假日（YYYY-MM-DD）。不配置时
        #                   用内置的 2026 年表；跨年后建议自行维护。
